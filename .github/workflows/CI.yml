name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia 1.12 / CPU runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JULIA_NUM_THREADS: auto
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'
      - uses: julia-actions/cache@v3
      - name: Instantiate
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate()'
      - name: Load package
        run: julia --project=. --color=yes -e 'using Scanvolver'
      - name: Run tests
        run: julia --project=. --color=yes -e 'using Pkg; Pkg.test()'
